<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>福礼派 · 新人福利</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ===== 设计令牌 ===== */
:root{
  --bg-deep:#360909;
  --bg:#59110d;
  --bg-card:rgba(140,28,21,.78);
  --bg-card-soft:rgba(255,243,221,.06);
  --gold:#f2b544;
  --gold-soft:#ffd97a;
  --gold-line:rgba(242,181,68,.55);
  --cream:#fff3dd;
  --cream-dim:rgba(255,243,221,.72);
  --cream-faint:rgba(255,243,221,.55);
  --radius-lg:24px;
  --radius-md:16px;
  --shadow-card:0 18px 44px rgba(30,5,5,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--cream);
  background:var(--bg-deep);
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  line-height:1.6;
}
.stage{
  position:relative;
  max-width:520px;
  margin:0 auto;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  padding:calc(18px + env(safe-area-inset-top)) 22px calc(26px + env(safe-area-inset-bottom));
  background:
    radial-gradient(120% 60% at 50% -8%, rgba(242,181,68,.16) 0%, transparent 60%),
    radial-gradient(90% 45% at 50% 108%, rgba(255,120,70,.12) 0%, transparent 55%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
  overflow:hidden;
}

/* ===== 顶栏 ===== */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:10px 2px 6px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:"Noto Serif SC","Songti SC",serif;
  font-weight:700;
  font-size:19px;
  letter-spacing:.06em;
}
.brand .logo{
  width:34px;height:34px;
  border-radius:10px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,var(--gold),#d99a2b);
  color:#4a140a;
  box-shadow:0 6px 16px rgba(242,181,68,.35);
}
.tag{
  font-size:12px;
  letter-spacing:.12em;
  color:#4a140a;
  background:linear-gradient(135deg,var(--gold-soft),var(--gold));
  padding:5px 12px;
  border-radius:999px;
  font-weight:500;
}

/* ===== Hero ===== */
.hero{
  text-align:center;
  padding:26px 6px 10px;
}
.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  letter-spacing:.34em;
  text-indent:.34em;
  color:var(--gold);
  padding:6px 14px;
  border:1px solid var(--gold-line);
  border-radius:999px;
  background:rgba(242,181,68,.08);
}
.hero h1{
  font-family:"Noto Serif SC","Songti SC",serif;
  font-weight:900;
  font-size:clamp(30px,8.4vw,44px);
  line-height:1.25;
  margin-top:16px;
  letter-spacing:.02em;
}
.hero h1 .gold{
  color:var(--gold);
}
.hero .sub{
  margin:12px auto 0;
  max-width:340px;
  color:var(--cream-dim);
  font-size:15px;
  font-weight:300;
}

/* ===== 礼盒互动区 ===== */
.gift{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-top:20px;
}
.box-card{
  position:relative;
  width:min(270px, 64vw);
  aspect-ratio:1;
  border-radius:50%;
  cursor:pointer;
  outline:none;
  -webkit-tap-highlight-color:transparent;
}
.box-card::before{
  content:"";
  position:absolute;
  inset:-7px;
  border-radius:50%;
  border:1.5px solid var(--gold-line);
  pointer-events:none;
}
.box-card::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  pointer-events:none;
  opacity:0;
}
.box-card.is-open::after{
  animation:ring-flash .7s ease-out forwards;
}
@keyframes ring-flash{
  0%{box-shadow:0 0 0 0 rgba(242,181,68,.55); opacity:1}
  100%{box-shadow:0 0 0 34px rgba(242,181,68,0); opacity:0}
}
.box-img{
  position:absolute;
  inset:0;
  width:100%;height:100%;
  border-radius:50%;
  object-fit:cover;
  transition:opacity .28s ease, transform .5s cubic-bezier(.18,.9,.28,1.35);
  will-change:transform;
}
.box-open{opacity:0; transform:scale(.72) rotate(-8deg)}
.box-card.is-open .box-closed{opacity:0; transform:scale(.9)}
.box-card.is-open .box-open{opacity:1; transform:scale(1) rotate(0)}
.box-shimmer{
  position:absolute;
  inset:0;
  border-radius:50%;
  overflow:hidden;
  pointer-events:none;
}
.box-shimmer::after{
  content:"";
  position:absolute;
  inset:-40%;
  background:conic-gradient(from 0deg, transparent 0deg, rgba(255,243,221,.16) 40deg, transparent 80deg);
  animation:shimmer 5s linear infinite;
}
@keyframes shimmer{
  to{transform:rotate(360deg)}
}
.box-hint{
  margin-top:18px;
  font-size:14px;
  color:var(--cream-faint);
  letter-spacing:.1em;
  text-align:center;
  transition:color .3s;
}
.box-card.is-open ~ .box-hint,
.box-card.is-open + .box-hint{
  color:var(--gold-soft);
}

/* ===== 福利卡片 ===== */
.perks{
  margin-top:34px;
  display:flex;
  flex-direction:column;
  gap:12px;
  opacity:0;
  transform:translateY(16px);
  transition:opacity .5s ease, transform .5s ease;
}
.perks.revealed{opacity:1; transform:none}
.perk{
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px 18px;
  border-radius:var(--radius-md);
  background:var(--bg-card);
  border:1px solid rgba(255,243,221,.08);
  box-shadow:var(--shadow-card);
}
.perk .ico{
  flex:none;
  width:46px;height:46px;
  border-radius:14px;
  display:grid;place-items:center;
  color:var(--gold);
  background:rgba(242,181,68,.14);
  border:1px solid var(--gold-line);
}
.perk h3{
  font-size:16px;
  font-weight:700;
  letter-spacing:.02em;
}
.perk p{
  font-size:13px;
  color:var(--cream-dim);
  font-weight:300;
  margin-top:2px;
}

/* ===== CTA ===== */
.cta{
  margin-top:32px;
  text-align:center;
}
.cta-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  min-height:58px;
  padding:14px 18px;
  border-radius:999px;
  font-family:"Noto Sans SC",sans-serif;
  font-size:18px;
  font-weight:700;
  letter-spacing:.14em;
  text-indent:.14em;
  text-decoration:none;
  color:#4a140a;
  background:linear-gradient(135deg,var(--gold-soft) 0%,var(--gold) 55%,#e0a334 100%);
  box-shadow:0 14px 30px rgba(242,181,68,.32);
  border:none;
  cursor:pointer;
  transition:transform .2s ease, box-shadow .2s ease, filter .2s ease;
}
.cta-btn:active{transform:scale(.97)}
.cta-btn:hover{filter:brightness(1.05)}
.cta-btn.ready{
  animation:cta-pulse 1.6s ease-in-out infinite;
}
@keyframes cta-pulse{
  0%,100%{box-shadow:0 14px 30px rgba(242,181,68,.32)}
  50%{box-shadow:0 14px 42px rgba(242,181,68,.55)}
}
.cta-note{
  margin-top:12px;
  font-size:12px;
  color:var(--cream-faint);
  letter-spacing:.06em;
}

/* ===== 说明 ===== */
.notes{
  margin-top:34px;
  padding:18px 20px;
  border-radius:var(--radius-md);
  background:var(--bg-card-soft);
  border:1px solid rgba(255,243,221,.08);
}
.notes li{
  list-style:none;
  display:flex;
  gap:10px;
  font-size:12.5px;
  color:var(--cream-faint);
  font-weight:300;
  line-height:1.7;
}
.notes li + li{margin-top:8px}
.notes .dot{
  flex:none;
  width:6px;height:6px;
  border-radius:50%;
  background:var(--gold);
  margin-top:7px;
}

/* ===== 页脚 ===== */
footer{
  margin-top:auto;
  padding-top:34px;
  text-align:center;
  font-size:12px;
  letter-spacing:.18em;
  color:var(--cream-faint);
}

/* ===== 粒子层 ===== */
#particles{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:50;
}
.particle{
  position:fixed;
  border-radius:2px;
  background:linear-gradient(135deg,var(--gold-soft),var(--gold));
  box-shadow:0 0 8px rgba(242,181,68,.6);
  animation:particle-fall .95s ease-out forwards;
}
.particle.circle{border-radius:50%}
@keyframes particle-fall{
  from{transform:translate(0,0) rotate(0deg); opacity:1}
  to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)); opacity:0}
}

/* ===== 焦点可见 ===== */
.box-card:focus-visible,
.cta-btn:focus-visible{
  outline:2px solid var(--gold-soft);
  outline-offset:4px;
}

/* ===== 动效降级 ===== */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="stage">

  <!-- ===== 顶栏 ===== -->
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="7" width="18" height="13" rx="2"></rect>
          <path d="M12 7v13"></path>
          <path d="M3 11h18"></path>
          <path d="M12 7c-1.5 0-3-1.2-3-3 0-1.4 1.2-2 2.4-1.2.6.4 1.2 1.8 2.1 1.8M12 7c1.5 0 3-1.2 3-3 0-1.4-1.2-2-2.4-1.2-.6.4-1.2 1.8-2.1 1.8"></path>
        </svg>
      </span>
      <span>福礼派</span>
    </div>
    <span class="tag">新人专享</span>
  </header>

  <!-- ===== Hero ===== -->
  <section class="hero">
    <span class="eyebrow">WELCOME GIFT</span>
    <h1>一份好礼<br><span class="gold">等你亲手拆开</span></h1>
    <p class="sub">进入微信，领取新人专属福利。心意已备好，点击礼盒开启惊喜。</p>
  </section>

  <!-- ===== 礼盒互动 ===== -->
  <section class="gift">
    <div class="box-card" id="boxCard" role="button" tabindex="0" aria-label="点击拆开礼盒，领取新人福利">
      <span class="box-shimmer" aria-hidden="true"></span>
      <img class="box-img box-closed" src="https://aka.doubaocdn.com/s/5t1TlSQgFM" alt="未拆封的红色礼盒">
      <img class="box-img box-open" src="https://aka.doubaocdn.com/s/v4rONUZHuW" alt="已拆开的礼盒，金色光芒溢出">
    </div>
    <p class="box-hint" id="boxHint">点击礼盒，拆开你的专属福利</p>
  </section>

  <!-- ===== 福利卡片 ===== -->
  <section class="perks" id="perks" aria-live="polite">
    <div class="perk">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="7" width="18" height="13" rx="2"></rect>
          <path d="M12 7v13"></path>
          <path d="M3 11h18"></path>
          <path d="M12 7c-1.5 0-3-1.2-3-3 0-1.4 1.2-2 2.4-1.2.6.4 1.2 1.8 2.1 1.8M12 7c1.5 0 3-1.2 3-3 0-1.4-1.2-2-2.4-1.2-.6.4-1.2 1.8-2.1 1.8"></path>
        </svg>
      </span>
      <div>
        <h3>新人见面礼包</h3>
        <p>进入微信即可领取，先到先得</p>
      </div>
    </div>
    <div class="perk">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5 12 4l9 5.5v9.2a1.3 1.3 0 0 1-1.3 1.3H4.3A1.3 1.3 0 0 1 3 18.7V9.5z"></path>
          <path d="M3 9.5 12 14l9-4.5"></path>
          <path d="M12 14v6.5"></path>
        </svg>
      </span>
      <div>
        <h3>专属权益</h3>
        <p>领取后自动到账，无需额外操作</p>
      </div>
    </div>
    <div class="perk">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3c1.8 4.2 3.9 6 8 6-4.1 0-6.2 1.8-8 6-1.8-4.2-3.9-6-8-6 4.1 0 6.2-1.8 8-6z"></path>
          <path d="M18.5 15c.9 2.1 2 3 4.5 3-2.5 0-3.6.9-4.5 3-.9-2.1-2-3-4.5-3 2.5 0 3.6-.9 4.5-3z"></path>
        </svg>
      </span>
      <div>
        <h3>限时福利</h3>
        <p>活动期间福利持续发放，别错过</p>
      </div>
    </div>
  </section>

  <!-- ===== CTA ===== -->
  <section class="cta">
    <button class="cta-btn" id="ctaBtn" type="button">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v13"></path>
        <path d="m5 11 7 7 7-7"></path>
        <path d="M4 21h16"></path>
      </svg>
      <span id="ctaText">立即领取福利</span>
    </button>
    <p class="cta-note">点击按钮将跳转至微信，领取新人福利</p>
  </section>

  <!-- ===== 说明 ===== -->
  <section class="notes">
    <ul>
      <li><span class="dot"></span>福利数量有限，先到先得，以微信内实际发放为准</li>
      <li><span class="dot"></span>按钮将跳转至微信，请确认目标微信页面来源可靠后再操作</li>
      <li><span class="dot"></span>如遇领取问题，请联系活动方客服</li>
    </ul>
  </section>

  <footer>福礼派 · 新人福利活动页</footer>
</div>

<div id="particles" aria-hidden="true"></div>

<script>
(function () {
  /* ================================================================
   * 跳转微信配置：把 APP_LINK 替换成你的微信目标链接即可。
   * 常见三种：
   *   1) 微信小程序（推荐）：
   *      在微信公众平台「小程序后台 - 工具 - 生成 URL Scheme」生成，
   *      形如 weixin://dl/business/?t=xxxxxx
   *   2) 公众号文章 / 网页：
   *      https://mp.weixin.qq.com/s/xxxxxx
   *   3) 企业微信客服 / 加群：
   *      https://work.weixin.qq.com/kfid/xxxxxx
   *      或 https://work.weixin.qq.com/gm/xxxxxx
   * 说明：点击按钮会直接跳转 / 唤起微信打开目标链接。
   * ================================================================ */
  var APP_LINK = 'weixin://dl/business/?t=YOUR_TOKEN';

  var boxCard = document.getElementById('boxCard');
  var boxHint = document.getElementById('boxHint');
  var perks = document.getElementById('perks');
  var ctaBtn = document.getElementById('ctaBtn');
  var ctaText = document.getElementById('ctaText');
  var opened = false;

  /* ----- 跳转微信（直接跳转，无复制引导） ----- */
  function openLink(url) {
    if (url.indexOf('weixin://') === 0) {
      window.location.href = url;
      return;
    }
    var win = window.open(url, '_blank', 'noopener');
    if (!win) {
      window.location.href = url;
    }
  }
  ctaBtn.addEventListener('click', function () {
    if (!opened) {
      openBox();
    }
    openLink(APP_LINK);
  });

  /* ----- 拆礼盒 ----- */
  function openBox() {
    if (opened) return;
    opened = true;
    boxCard.classList.add('is-open');
    boxHint.textContent = '福利已拆开，快去领取吧';
    perks.classList.add('revealed');
    ctaBtn.classList.add('ready');
    ctaText.textContent = '领取新人礼包';
    spawnBurst();
  }
  boxCard.addEventListener('click', openBox);
  boxCard.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openBox();
    }
  });

  /* ----- 金色粒子 ----- */
  function spawnBurst() {
    var layer = document.getElementById('particles');
    var box = boxCard.getBoundingClientRect();
    var cx = box.left + box.width / 2;
    var cy = box.top + box.height / 2;
    for (var i = 0; i < 26; i++) {
      var p = document.createElement('span');
      p.className = 'particle' + (Math.random() > 0.5 ? ' circle' : '');
      var size = 5 + Math.random() * 8;
      var angle = Math.random() * Math.PI * 2;
      var dist = 90 + Math.random() * 150;
      p.style.left = (cx - size / 2) + 'px';
      p.style.top = (cy - size / 2) + 'px';
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
      p.style.setProperty('--dy', (Math.sin(angle) * dist - 60) + 'px');
      p.style.setProperty('--rot', (Math.random() * 540 - 270) + 'deg');
      p.style.animationDelay = (Math.random() * 0.12) + 's';
      layer.appendChild(p);
      p.addEventListener('animationend', function () {
        p.remove();
      }, { once: true });
    }
  }
})();
</script>
</body>
</html>
